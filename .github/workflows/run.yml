name: AutoPostNooraxoV2

on:
  schedule:
    - cron: "30 5 * * *"    # 10:30 AM Pakistan
    - cron: "30 9 * * *"    # 02:30 PM Pakistan
    - cron: "30 15 * * *"   # 08:30 PM Pakistan
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y moviepy pillow || true
          pip install --no-cache-dir -r requirements.txt
          python -c "from moviepy.editor import ImageClip; print('MoviePy OK')"

      - name: Run Script
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
        run: python main.py

      - name: Commit updates
        if: always()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add memory.csv run_log.txt run_lock.txt || true
          git status --short
          git commit -m "Auto update" || echo "No changes"
          git push || echo "No push needed"
